# =============================================================================
# Trend Radar — Red lines（红线词表）
# =============================================================================
# Two enforcement points:
#   1. `hard_block` patterns drop a candidate BEFORE it reaches the LLM
#      (case-insensitive substring / regex on the title).
#   2. `protected_ip`, `brand_noise`, `off_topic`, `forbidden_claims` are
#      passed into the classification prompt; the model must DROP a topic
#      whose subject is one of these, but may keep it when the term is only
#      background (e.g. "Roblox lets creators ship standalone apps" is fine,
#      "make your own Pokémon in 3D" is not).
# Review with SEO + legal before first production run. Edit freely.

# ---- 1. Hard block: never even shown to the model ----------------------------
