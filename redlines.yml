# ---- 3. Brand-noise: rising queries that share a word with a seed brand ------
# seo-tool seeds are brand names; Google returns homonyms. Drop when the
# related query is about these senses.
brand_noise:
  _all: ["near me", lidl, walmart, costco, aldi, target hours, weather, "opening hours", "stock price", earnings, lyrics, playoff]   # applied to every seed
  Tripo: [zara, holafly, "virgin holidays", trip advisor, tripadvisor, travel, hotel, flight, vacation]
  Scenario: [lyrics, 歌詞, "love scenario", "dream scenario", ikon, betekenis, pluriel, "worst case", "wurst case", "grey goo", eas, meaning, definition, playoff, dvd, movie, film, nicolas cage]
  Spline: [chart, excel, regression, "spline interpolation", math, python, scipy]
  Luma AI: [luma dream machine review only if unrelated to 3D, lumapay, luma fitness]
  Rodin AI: [auguste rodin, sculptor, museum, "the thinker"]
  Kaedim: []
  Polycam: [polycamp]
  Meshy: [meshy top, meshy dress, "mesh wifi", meshy shirt]
  Sketchfab: [sketchpad, sketchup pro price]   # SketchUp itself is a legit 3D tool; keep "sketchup vs" queries
  3d model: [3d model kits car, "3d model porn", nude]
  3d printing: [jasa, "near me", storefront, franchise, stock price, earnings, dental implant, aerospace, automotive plant]

