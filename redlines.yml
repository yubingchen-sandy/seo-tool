# ---- 5. Forbidden claims: never a page angle, regardless of trend --------------
# The classifier must not propose pages built on these promises.
forbidden_claims:
  - 'Meshy generates game-ready assets with zero cleanup'
  - 'Meshy replaces 3D artists / "no artists needed"'
  - 'Meshy output is copyright-free / "commercial use guaranteed" without pointing to the actual terms'
  - 'Meshy is free (only the free tier is; never say the product is free)'
  - 'Meshy models are 3D-print-ready without checking (manifold / wall thickness)'
  - 'Any price, credit amount or limit not copied from meshy.ai/pricing at time of writing'
  - 'Any competitor pricing or feature claim without a dated source link'
  - '"Best" / "#1" claims without a comparison table backing them'
  - 'Medical, legal, financial or safety advice of any kind'
