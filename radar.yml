# -- Scoring ------------------------------------------------------------------
weights:
  lexicon_hit: 2
  extra_source: 3        # per independent source beyond the first
  has_rising: 3          # cluster contains a seo-tool rising query
  has_trends_now: 2
  hn_points_per_point: 0.02
  hn_points_cap: 4
  reddit_score_cap: 4
  youtube_views_cap: 4
  query_breadth_cap: 3   # bonus for being hit by several Google News / HN queries
min_relevance_single_source: 1   # rel <= 0 and only one source -> dropped pre-LLM

# -- LLM classification -------------------------------------------------------
llm:
  model: claude-opus-5
  effort: medium
  top_n: 90                 # candidates sent to the model per day
  queued_lookback_days: 21  # topics already queued in this window are shown to the model for dedupe

# -- Sitemap (cannibalisation check) -------------------------------------------
sitemap_index: https://www.meshy.ai/sitemap.xml
sitemap_sections: [blog, features, 3d-tools, static, 3d-glossary]
