# =============================================================================
# Trend Radar — Configuration
# =============================================================================
# Stage 1-3 of the "热点驱动 SEO 扩词" plan: gather Meshy-relevant hot topics
# from many sources, cluster, pre-score, check against the live sitemap, then
# hand the top candidates to Claude for intent classification (src/radar).
# Red lines live in redlines.yml. Edit, commit, push — next run picks it up.

# -- Google News RSS: intent-shaped queries ---------------------------------
# Each query is searched with `when:2d`. Items hit by several queries at once
# are a natural relevance signal. Keep queries specific: "image to 3D" alone
# pulled in industrial 3D-printing news, so it is phrased tighter below.
news_queries:
  - text to 3D
  - AI 3D model generator
  - image to 3D model AI
  - 3D asset generator
  - game ready 3D assets
  - Blender addon
  - Blender 3D modeling AI
  - Unity asset store
  - Unreal Engine 5 assets
  - Roblox creator tools
  - Roblox Studio AI
  - Godot engine
  - AI game development
  - game asset AI
  - 3D animation AI
  - auto rigging 3D
  - 3D character generator
  - AI texture generator
  - retopology
  - 3D printing STL model
  - Meshy AI
  - Tripo AI
  - Hunyuan 3D
  - Rodin AI 3D
  - Sketchfab
  - Fab marketplace Epic
  - VR avatar 3D
  - 3D scanning app
  - Gaussian splatting
  - NVIDIA Omniverse
  - MetaHuman
  - Minecraft 3D model
  - Fortnite UEFN

# -- Industry RSS feeds -------------------------------------------------------
feeds:
  80lv: https://80.lv/feed/
  blendernation: https://www.blendernation.com/feed/
  godot: https://godotengine.org/rss.xml
  roblox-devforum: https://devforum.roblox.com/c/updates/announcements/36.rss
  gamesindustry: https://www.gamesindustry.biz/feed
  3dprintingindustry: https://3dprintingindustry.com/feed/
  the-decoder: https://the-decoder.com/feed/
  techcrunch-ai: https://techcrunch.com/category/artificial-intelligence/feed/
  creativebloq: https://www.creativebloq.com/feeds.xml
  arxiv-cs.GR: https://rss.arxiv.org/rss/cs.GR
  sketchfab-blog: https://sketchfab.com/blogs/community/feed/
  itch-devlogs: https://itch.io/devlogs.xml
feed_max_age_days: 3

# -- Hacker News (Algolia) ----------------------------------------------------
hn_queries: ["3D", "Blender", "Unity", "Unreal", "Godot", "game dev", "text-to-3D", "mesh", "generative"]
hn_min_points: 10
hn_max_age_days: 3

# -- Google Trends trending-now (trendspy), category filter -------------------
# Topic ids: 6 Games, 18 Technology, 15 Science, 8 Hobbies and Leisure
trends_now_geos: ["US", "GB"]
trends_now_topics: [6, 18, 15, 8]

# -- seo-tool rising queries (this repo's own daily snapshot) -----------------
rising_lookback_days: 3

# -- Reddit (optional — needs REDDIT_CLIENT_ID / REDDIT_CLIENT_SECRET) --------
subreddits: [gamedev, blender, Unity3D, unrealengine, godot, roblox, 3Dprinting, 3Dmodeling, IndieDev, StableDiffusion]
reddit_min_score: 50

# -- YouTube (optional — needs YOUTUBE_API_KEY) --------------------------------
youtube_queries: ["ai 3d model generator", "text to 3d", "blender ai", "roblox ai", "game assets ai"]
youtube_max_age_days: 3

